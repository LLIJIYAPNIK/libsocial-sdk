[project]
name = "mangalib-python-sdk"
version = "0.1.0"
description = "Async Python SDK for mangalib.me: title metadata, chapters, translations, catalog and page images"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "LLIJIYAPNIK", email = "kas4wot@yandex.ru" }
]
keywords = ["mangalib", "manga", "manhwa", "comics", "lib.social", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "libsocial-core>=1.0,<2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# PDF export. Without it, "pdf" just isn't one of the export formats.
pdf = ["img2pdf>=0.5"]

[project.urls]
Homepage = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk"
Repository = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk"
Issues = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk/issues"
Changelog = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk/blob/main/packages/mangalib/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mangalib"

# Inside this repository the core comes from the workspace, not PyPI.
[tool.uv.sources]
libsocial-core = { workspace = true }

# Test stack for this package only, same reason as ranobelib's: `uv run --package
# mangalib-python-sdk` installs the package's own groups, not the root's.
[dependency-groups]
dev = [
    "img2pdf>=0.5",
    "pypdf>=6.14.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",
    "vcrpy>=6.0",
]
