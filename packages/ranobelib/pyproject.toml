[project]
name = "ranobelib-python-sdk"
version = "0.13.0"
description = "Async Python SDK for ranobelib.me: title metadata, chapter/volume downloads, and export to epub/fb2/txt/pdf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "LLIJIYAPNIK", email = "kas4wot@yandex.ru" }
]
keywords = ["ranobelib", "ranobe", "novel", "webnovel", "epub", "fb2", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "ebooklib>=0.20",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=15.0.0",
    "weasyprint>=69.0",
]

[project.urls]
Homepage = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk"
Repository = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk"
Issues = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk/issues"
Changelog = "https://github.com/LLIJIYAPNIK/ranobelib-python-sdk/blob/main/packages/ranobelib/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ranobelib"
