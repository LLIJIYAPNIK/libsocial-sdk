[project]
name = "ranobelib-python-sdk"
version = "0.13.0"
description = "Async Python SDK for ranobelib.me: title metadata, chapter/volume downloads, and export to epub/fb2/txt/pdf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "LLIJIYAPNIK", email = "kas4wot@yandex.ru" }
]
keywords = ["ranobelib", "ranobe", "novel", "webnovel", "epub", "fb2", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "ebooklib>=0.20",
    "httpx>=0.27",
    "libsocial-core>=1.0,<2",
    "pydantic>=2.7",
    "weasyprint>=69.0",
]

[project.urls]
Homepage = "https://github.com/LLIJIYAPNIK/libsocial-sdk"
Repository = "https://github.com/LLIJIYAPNIK/libsocial-sdk"
Issues = "https://github.com/LLIJIYAPNIK/libsocial-sdk/issues"
Changelog = "https://github.com/LLIJIYAPNIK/libsocial-sdk/blob/main/packages/ranobelib/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ranobelib"

# Inside this repository the core comes from the workspace, not PyPI.
[tool.uv.sources]
libsocial-core = { workspace = true }

# Test stack for this package only. Workspace-wide tools (ruff, mypy, coveralls) live in the
# root pyproject.toml's dev group. Kept here rather than at the root because
# `uv run --package ranobelib-python-sdk` installs the package's own groups, not the root's.
[dependency-groups]
dev = [
    "lxml>=5.0",
    "pypdf>=6.14.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",
    "vcrpy>=6.0",
]
