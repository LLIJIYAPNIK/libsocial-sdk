[project]
name = "libsocial-core"
version = "1.0.0"
description = "Async core shared by the lib.social site SDKs: api.cdnlibs.org client, caching, titles, chapters and catalog"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "LLIJIYAPNIK", email = "kas4wot@yandex.ru" }
]
keywords = ["lib.social", "ranobelib", "mangalib", "cdnlibs", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/LLIJIYAPNIK/libsocial-sdk"
Repository = "https://github.com/LLIJIYAPNIK/libsocial-sdk"
Issues = "https://github.com/LLIJIYAPNIK/libsocial-sdk/issues"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "libsocial"

# Test stack for this package only — see packages/ranobelib/pyproject.toml for why it isn't
# in the workspace root's dev group.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
