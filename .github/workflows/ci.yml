name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv run mypy packages/core/src packages/ranobelib/src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # WeasyPrint (pdf exporter) needs these at import time, not just install time -- see
      # docs/api-notes.md's "PDF export" notes. Without them, pdf-exporter tests skip
      # instead of failing (see packages/ranobelib/tests/unit/test_pdf_exporter.py), so CI
      # would still pass but silently stop actually exercising that exporter.
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # One run per package, each with only that package installed (--package) and its own
      # coverage threshold, and each given its own tests/ explicitly: the root testpaths
      # list every package's tests, which a package that doesn't depend on another can't
      # import.
      - run: uv run --package libsocial-core --python ${{ matrix.python-version }} pytest packages/core/tests --cov=libsocial --cov-fail-under=95
      # Last, so .coverage (uploaded below) holds this package's data, as before.
      - run: uv run --package ranobelib-python-sdk --python ${{ matrix.python-version }} pytest packages/ranobelib/tests --cov=ranobelib --cov-report=xml --cov-fail-under=95 --record-mode=none
      # One upload, not three: the matrix runs the same suite on 3.11/3.12/3.13, and
      # Coveralls treats each upload as its own build, so uploading from every leg would
      # just create noise (and cost separate build slots) for identical coverage data.
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        run: uv run coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv build --package libsocial-core
      - run: uv build --package ranobelib-python-sdk

  # The tests above use the workspace's libsocial-core, which is always "released enough".
  # This installs each facade the way a user would, with the newest libsocial-core on PyPI
  # its constraint allows (--no-sources ignores [tool.uv.sources]), and runs its tests — so a
  # facade that needs a core change not released yet fails here rather than after its own
  # release.
  facade-vs-published-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ranobelib]
    steps:
      - uses: actions/checkout@v7
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # Bootstrap only: until libsocial-core's first release there is nothing to test
      # against, and the release workflow that publishes it is what this check runs beside.
      # Skipped only on PyPI's definite 404 for the project; anything else (a network
      # failure, a 5xx after retries) fails the job rather than passing it untested.
      - name: Check libsocial-core is on PyPI
        id: core
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
            https://pypi.org/pypi/libsocial-core/json) || true
          case "$status" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::warning::libsocial-core isn't on PyPI yet, skipping until its first release (core-v1.0.0)."
              echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Couldn't tell whether libsocial-core is on PyPI (HTTP ${status:-none})."
              exit 1 ;;
          esac
      - name: Install the facade with libsocial-core from PyPI
        if: steps.core.outputs.published == 'true'
        run: |
          uv venv --python 3.12 .venv-published
          uv pip install --python .venv-published --no-sources \
            "./packages/${{ matrix.package }}" \
            --group "packages/${{ matrix.package }}/pyproject.toml:dev"
          uv pip show --python .venv-published libsocial-core
      - name: Test the facade
        if: steps.core.outputs.published == 'true'
        run: .venv-published/bin/python -m pytest "packages/${{ matrix.package }}/tests" --record-mode=none

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # prepend: the tests import the scripts from their own directory. GIT_CLIFF is the same
      # command changelog.yml uses — without it the update_changelog tests would skip.
      - run: uv run pytest .github/scripts --import-mode=prepend -rs
        env:
          GIT_CLIFF: uvx --from git-cliff==2.14.2 git-cliff

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # --strict turns broken cross-references (e.g. a docs/reference.md ::: pointing at a
      # renamed/removed symbol) into a build failure instead of a silently broken page.
      - run: uv run --group docs mkdocs build --strict
