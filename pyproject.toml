# Workspace root: not a package itself. Each published package lives under packages/ with its
# own pyproject.toml (and its own test dependencies); this file only ties them into one uv
# workspace (one shared uv.lock) and holds the dev-tool settings and tools they all share.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "coveralls>=4.0",
    "mypy>=1.10",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src"]
extend-exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/ranobelib/src"]

[[tool.mypy.overrides]]
# ebooklib and weasyprint ship no type stubs / py.typed marker.
module = ["ebooklib", "ebooklib.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/ranobelib/tests"]

[tool.coverage.run]
source = ["ranobelib"]

[tool.coverage.report]
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
