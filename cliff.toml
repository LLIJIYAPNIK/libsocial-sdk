# One config for every package's CHANGELOG.md. .github/scripts/update_changelog.py (run by
# .github/workflows/changelog.yml) has git-cliff render one release's section — the package's
# commits between its previous release tag and this one — and puts it right under this
# header in that package's file; history is never regenerated — path filtering can't tell
# ranobelib's pre-monorepo commits (src/, .github/, ...) from later shared ones, so a full
# regeneration would empty its old sections. Hence no tag_pattern and no link footer here:
# the old sections keep their own link definitions, new ones link from the heading.
# CHANGELOG_PREVIOUS_TAG/CHANGELOG_DATE come from the script: it knows the previous release
# and the release's date even where --include-path hides them from git-cliff.
[changelog]
header = """
# Changelog

All notable changes to this package are documented here.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the
package follows [Semantic Versioning](https://semver.org/). Entries are generated from
[Conventional Commits](https://www.conventionalcommits.org/) messages by `cliff.toml` +
`.github/workflows/changelog.yml`, which adds each release's section here and pushes it to
`main` whenever a GitHub Release of this package is published — don't hand-edit released
sections, fix the underlying commit message/PR title instead.

"""
# The version in the heading drops the package's tag prefix: ranobelib-v0.14.0 -> 0.14.0.
body = """
{% if version %}\
    {% set number = version | split(pat="-v") | last | trim_start_matches(pat="v") %}\
    {% set repo = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo %}\
    {% set previous_tag = get_env(name="CHANGELOG_PREVIOUS_TAG", default=previous.version | default(value="")) %}\
    {% set day = get_env(name="CHANGELOG_DATE", default=timestamp | date(format="%Y-%m-%d")) %}\
    {% if previous_tag %}\
        ## [{{ number }}]({{ repo }}/compare/{{ previous_tag }}..{{ version }}) - {{ day }}
    {% else %}\
        ## [{{ number }}]({{ repo }}/tree/{{ version }}) - {{ day }}
    {% endif %}\
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}

"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
filter_commits = true
topo_order = false
sort_commits = "oldest"

# Only commit types that describe a user-facing change get a changelog entry —
# `test:`/`chore:`/`docs:`/`style:`/`refactor:` commits are implementation detail (this repo
# commits atomically per sub-step, see CLAUDE.md's Git workflow section, so there are many of
# them per feature) and would drown out what actually changed. `ci:` is the exception: unlike
# the others, this repo's `ci:` commits are typically user-relevant project changes in their
# own right (new automation, new release/publishing infra), not internal noise — a release
# made up entirely of `ci:` commits (e.g. v0.3.0, which only added CHANGELOG.md automation)
# should still show up instead of being silently dropped for having zero feat/fix/perf.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^ci", group = "Changed" },
    { message = "^refactor", skip = true },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
    { message = "^build", skip = true },
]
